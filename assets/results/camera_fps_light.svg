<title id="t">ESP32-CAM frame rate by resolution</title>
<desc id="d">Measured from the wired PC on 2026-11-06 in one view: 160x120 at 10.1 fps, 320x240 at 9.3 fps, 640x480 at 4.1 fps, 800x600 at 3.2 fps. The firmware caps the stream at 10 fps.</desc>
