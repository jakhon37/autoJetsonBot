version: "3.9"
services:
  autojetsonbot:
    build:
      context: .
      dockerfile: Dockerfile.foxy
    image: auto_ros:foxy
    container_name: auto_ros_foxy
    network_mode: host
    ipc: host
    volumes:
      - .:/autonomous_ROS
    privileged: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
    # For hardware USB passthrough (uncomment and adjust):
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # Ports via host network: 5900 (VNC), 8000 (Web UI), 9090 (rosbridge)
