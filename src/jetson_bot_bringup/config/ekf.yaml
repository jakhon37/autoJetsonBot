### ekf.yaml - Sensor Fusion Configuration
### autoJetsonBot Phase 3

ekf_filter_node:
  ros__parameters:
    use_sim_time: false

    # Standard frames
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map              # Defaults to 'map'
    odom_frame: odom            # Defaults to 'odom'
    base_link_frame: base_footprint  # Match existing robot root
    world_frame: odom           # Fusion happens in odom frame

    # 1. Odometry from Wheel Encoders
    odom0: /odom
    odom0_config: [true,  true,  false, 
                   false, false, false, 
                   true,  false, false, 
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # 2. IMU from Madgwick Filter
    imu0: /imu/data
    imu0_config: [false, false, false, 
                  true,  true,  true, 
                  false, false, false, 
                  true,  true,  true,
                  true,  true,  false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # Process Noise Covariance (relative trust)
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
