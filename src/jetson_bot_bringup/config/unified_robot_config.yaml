# ROS 2 Controller Manager parameters
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    
    diff_cont:
      type: diff_drive_controller/DiffDriveController
      
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

# Differential drive controller parameters
diff_cont:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.18
    wheel_radius: 0.035
    publish_rate: 50.0
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    use_stamped_vel: false

# Joint state broadcaster parameters
joint_broad:
  ros__parameters:
    use_sim_time: true
    joints:
      - left_wheel_joint
      - right_wheel_joint
