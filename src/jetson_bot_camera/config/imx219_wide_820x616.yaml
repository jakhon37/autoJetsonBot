# Provisional lens calibration of the robot's IMX219 camera, rational_polynomial model, for
# 820x616 frames from tools/csi_camera_server.py with flip 0 (CAMERA_FLIP in robot.sh).
# Fitted by tools/camera_intrinsics.py on 2026-11-24, after the lens was locked, from 6 views
# of a checkerboard with 8 x 6 inner corners shown on an iPad: 0.347 px on those views and
# 0.384 px on views left out of the fit (experiment 21 in docs/experiments/RESULTS.md).
# The views reached only the middle of the picture, out to 62% of the half diagonal. One
# standard deviation: focal length 5 px, principal point 7 px across and 9 px down. The
# outer part of the picture is extrapolated: the fisheye model, fitted to the same views,
# puts rays 1 to 2 degrees apart from this one. Calibrate again with views reaching the
# corners before relying on bearings near the edges.
image_width: 820
image_height: 616
camera_name: imx219_wide
camera_matrix:
  rows: 3
  cols: 3
  data: [447.79863, 0, 408.46155, 0, 452.32649, 314.05177, 0, 0, 1]
distortion_model: rational_polynomial
distortion_coefficients:
  rows: 1
  cols: 8
  data: [-0.67903619, -0.92452949, -0.011358686, 0.0053632064, 0.95664719, -0.2806166, -1.4787597, 1.1996282]
rectification_matrix:
  rows: 3
  cols: 3
  data: [1, 0, 0, 0, 1, 0, 0, 0, 1]
projection_matrix:
  rows: 3
  cols: 4
  data: [397.97769, 0, 416.43966, 0, 0, 398.53223, 299.41609, 0, 0, 0, 1, 0]
